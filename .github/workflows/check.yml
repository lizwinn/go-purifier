# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main.
#
# `flake-check` builds the flake's checks: every fixture offline from its
# lockfile, the release archives, the go-purifier command with its unit
# tests, and the formatting. It also evaluates the checks for
# aarch64-linux.
#
# `outside-the-sandbox` runs what needs Nix, servers or the network and so
# cannot run in the Nix sandbox: interactive mode (tests/interactive.sh),
# the release command (tests/release.sh), modules from Mercurial,
# Subversion, Bazaar and Fossil repositories served on the runner
# (tests/vcs-systems.sh), and the lock itself, which relocks this
# repository and every fixture from the module proxy and from git and
# fails when a lockfile differs from the committed one.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check --print-build-logs
      - name: Evaluate the checks for every system
        run: nix flake check --all-systems --no-build

  outside-the-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the toolchain
        run: nix build .#toolchain --out-link toolchain
      - name: Interactive mode
        run: tests/interactive.sh toolchain/bin
      - name: Release
        run: tests/release.sh toolchain/bin
      - name: Modules from Mercurial, Subversion, Bazaar and Fossil
        run: tests/vcs-systems.sh toolchain/bin
      - name: Relock this repository and the fixtures
        run: |
          for dir in . tests/fixtures/hello tests/fixtures/workspace tests/fixtures/replace/app tests/fixtures/vcs; do
            (cd "$dir" && "$GITHUB_WORKSPACE/toolchain/bin/go-purifier" relock)
          done
      - name: Compare with the committed lockfiles
        run: |
          # The go version is recorded for reference and follows nixpkgs.
          git diff --exit-code -I '"goVersion"' -- '*.lock.json'
