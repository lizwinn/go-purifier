# SPDX-License-Identifier: MIT
#
# Checks every pull request and every push to main.
#
# `flake-check` builds the flake's checks: the fixture module offline from
# its lockfile, the go-purifier command with its unit tests, and the
# formatting. `relock` runs the lock itself, which needs the network and so
# cannot run in the Nix sandbox: it relocks the fixture from the module
# proxy and fails when the lockfile it writes differs from the committed
# one.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build the checks
        run: nix flake check --print-build-logs

  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Relock the fixture and this repository
        run: |
          nix build .#toolchain --out-link toolchain
          (cd tests/fixtures/hello && ../../../toolchain/bin/go-purifier relock)
          ./toolchain/bin/go-purifier relock
      - name: Compare with the committed lockfiles
        run: |
          # The go version is recorded for reference and follows nixpkgs.
          git diff --exit-code -I '"goVersion"' -- '*.lock.json'
